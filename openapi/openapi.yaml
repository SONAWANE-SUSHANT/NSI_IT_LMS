      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Enter standard JWT Bearer token: Bearer <token>'
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Invalid or expired authentication token'
