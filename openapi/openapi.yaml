openapi: 3.0.3
info:
  title: 'NSI-IT-LMS API Documentation'
  description: 'Complete, production-ready REST API documentation for the NSI IT Learning Management System (Nityashree Infosystems LMS). Includes Authentication, Role-based User Management, Courses, Modules, Lectures & Notes, Cohort Batches & Allocations, Quizzes & Judge0 Code Execution, Schedules, Reviews, Announcements, Notifications, Platform Settings, and Reporting Hub.'
  version: 1.0.0
  contact:
    name: 'NSI IT Support'
    email: support@nsiit.com
servers:
  -
    url: 'http://localhost:5000'
    description: 'Local Development Server'
tags:
  -
    name: System
    description: 'System health check'
  -
    name: Authentication
    description: 'User login and session lifecycle'
  -
    name: Profile
    description: 'Personal profile details and avatar management'
  -
    name: 'Admin Users'
    description: 'CRUD operations for system users, CSV import, and device controls'
  -
    name: 'Admin Portal Views'
    description: 'Administrative impersonation of faculty and students'
  -
    name: Courses
    description: 'Course catalog operations'
  -
    name: Modules
    description: 'Course syllabus modules'
  -
    name: Lectures
    description: 'Module lecture sessions (live and recorded)'
  -
    name: 'Lecture Notes'
    description: 'Lecture attachments and materials'
  -
    name: Batches
    description: 'Student cohort batches'
  -
    name: 'Batch Instructors'
    description: 'Assigning instructors to cohort batches'
  -
    name: 'Batch Students'
    description: 'Enrolling students into cohort batches'
  -
    name: 'Instructor Portal'
    description: 'Faculty batch management, live sessions, announcements, and reviews'
  -
    name: 'Student Portal'
    description: 'Student enrolled courses, curriculum player, progress tracking, announcements, and reviews'
  -
    name: 'Quizzes (Admin & Instructor)'
    description: 'Quiz authoring, MCQ and coding questions, options, and submission reviews'
  -
    name: 'Student Quizzes & Assessment'
    description: 'Student quiz taking, Judge0 code execution, submission, and scorecard results'
  -
    name: 'Course Reviews'
    description: 'Course ratings and moderation'
  -
    name: Announcements
    description: 'Academy, course, and batch broadcast notices'
  -
    name: Notifications
    description: 'User notifications and read receipts'
  -
    name: 'Reports & Analytics'
    description: 'Administrative reporting, KPI metrics, and student dossiers'
  -
    name: 'Platform Settings'
    description: 'Global LMS configuration and academic parameters'
  -
    name: 'RBAC Test'
    description: 'Role validation test routes'
paths:
  /api/health:
    get:
      tags:
        - System
      summary: 'API Health Check'
      description: 'Check if the server and API are operational.'
      responses:
        '200':
          description: 'Service is healthy'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  message: {type: string, example: 'NSI IT LMS API is running'}
                  uptime: {type: number, example: 123.45}
                  timestamp: {type: number, example: 1773484800000}
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: 'User Login'
      description: 'Authenticate with username or email along with password. Enforces device limits for student logins and returns JWT token.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin@nsiit.com
                  description: 'Username or email'
                password:
                  type: string
                  example: Admin@123
      responses:
        '200':
          description: 'Login successful'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  message: {type: string, example: 'Login successful'}
                  data: {type: object, properties: {token: {type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...}, user: {$ref: '#/components/schemas/User'}}}
        '401':
          description: 'Invalid credentials or account suspended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 'Student device limit exceeded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/profile:
    get:
      tags:
        - Profile
      summary: 'Get current user profile'
      description: 'Retrieve profile details of the authenticated user.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'User profile details'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data: {$ref: '#/components/schemas/User'}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags:
        - Profile
      summary: 'Update current user profile'
      description: 'Update personal profile information such as contact number, DOB, or gender.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_no:
                  type: string
                  example: '9876543210'
                date_of_birth:
                  type: string
                  format: date
                  example: '1998-05-20'
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
                  example: MALE
      responses:
        '200':
          description: 'Profile updated successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/profile/photo:
    put:
      tags:
        - Profile
      summary: 'Upload profile photo'
      description: 'Upload base64 encoded photo string or image URL for profile picture.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  example: 'data:image/png;base64,iVBORw0KGgoAAA...'
      responses:
        '200':
          description: 'Photo updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/users:
    get:
      tags:
        - 'Admin Users'
      summary: 'List all users'
      description: 'Administrator endpoint to retrieve users with filtering by role_id, status, and search query.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: role_id
          in: query
          schema:
            type: integer
          description: 'Filter by role ID (1: Admin, 2: Instructor, 3: Student)'
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - SUSPENDED
        -
          name: search
          in: query
          schema:
            type: string
          description: 'Search by name, email, or contact number'
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 'List of users with pagination'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data: {type: object, properties: {total: {type: integer, example: 45}, totalPages: {type: integer, example: 5}, currentPage: {type: integer, example: 1}, users: {type: array, items: {$ref: '#/components/schemas/User'}}}}
        '403':
          description: 'Forbidden - Requires Admin role'
    post:
      tags:
        - 'Admin Users'
      summary: 'Create a user'
      description: 'Create a new administrator, instructor, or student account.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - password
                - role_id
                - contact_no
                - gender
              properties:
                first_name:
                  type: string
                  example: Amit
                last_name:
                  type: string
                  example: Verma
                email:
                  type: string
                  format: email
                  example: amit.verma@nsiit.com
                password:
                  type: string
                  example: Student@123
                role_id:
                  type: integer
                  enum: [1, 2, 3]
                  example: 3
                contact_no:
                  type: string
                  example: '9876501234'
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
                  example: MALE
                date_of_birth:
                  type: string
                  format: date
                  example: '2001-08-14'
      responses:
        '201':
          description: 'User created successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 'Validation error'
        '409':
          description: 'Email already registered'
  '/api/admin/users/{id}':
    get:
      tags:
        - 'Admin Users'
      summary: 'Get single user by ID'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/User'}
    put:
      tags:
        - 'Admin Users'
      summary: 'Update user profile'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                contact_no:
                  type: string
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/admin/users/{id}/status':
    patch:
      tags:
        - 'Admin Users'
      summary: 'Update user status'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, SUSPENDED]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/users/students/import:
    post:
      tags:
        - 'Admin Users'
      summary: 'Bulk import students from CSV'
      description: 'Accepts parsed student records array and performs atomic transactional batch insertion.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - students
              properties:
                students:
                  type: array
                  items: {type: object, required: [first_name, last_name, email, contact_no], properties: {first_name: {type: string, example: Aarav}, last_name: {type: string, example: Shah}, email: {type: string, example: aarav.shah@gmail.com}, contact_no: {type: string, example: '9876543210'}, gender: {type: string, example: MALE}}}
      responses:
        '200':
          description: 'Bulk import result with created and failed count'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  importedCount: {type: integer}
  '/api/admin/users/{id}/devices':
    get:
      tags:
        - 'Admin Users'
      summary: 'Get user active devices'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  devices: {type: array, items: {type: object}}
  '/api/admin/users/{id}/devices/{deviceId}':
    delete:
      tags:
        - 'Admin Users'
      summary: 'Revoke user registered device'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/admin/instructors/{id}/portal':
    get:
      tags:
        - 'Admin Portal Views'
      summary: 'Admin view of Instructor Portal'
      description: 'Allows an Administrator to inspect the exact portal layout and statistics for any specific faculty member.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Instructor context details'
  '/api/admin/students/{id}/portal':
    get:
      tags:
        - 'Admin Portal Views'
      summary: 'Admin view of Student Portal'
      description: 'Allows an Administrator to inspect the student portal view for any specific learner.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Student context details'
  /api/courses:
    get:
      tags:
        - Courses
      summary: 'List all courses'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
              - DRAFT
              - INACTIVE
        -
          name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {type: array, items: {$ref: '#/components/schemas/Course'}}
    post:
      tags:
        - Courses
      summary: 'Create new course'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  example: FS-NODE
                name:
                  type: string
                  example: 'Node.js Microservices'
                description:
                  type: string
                  example: 'Backend engineering course'
                duration:
                  type: string
                  example: '3 Months'
                status:
                  type: string
                  enum: [DRAFT, ACTIVE]
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/courses/{id}':
    get:
      tags:
        - Courses
      summary: 'Get course details and syllabus'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/Course'}
    put:
      tags:
        - Courses
      summary: 'Update course details'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/courses/{id}/status':
    patch:
      tags:
        - Courses
      summary: 'Update course status'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/courses/{courseId}/modules':
    post:
      tags:
        - Modules
      summary: 'Create module in course'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: 'Express Architecture'
                description:
                  type: string
                  example: 'Routing, middleware, and controllers'
                display_order:
                  type: integer
                  example: 1
                duration:
                  type: string
                  example: '2 Weeks'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Modules
      summary: 'Get all modules for a course'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {type: array, items: {$ref: '#/components/schemas/CourseModule'}}
  '/api/modules/{moduleId}':
    get:
      tags:
        - Modules
      summary: 'Get module details'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/CourseModule'}
    put:
      tags:
        - Modules
      summary: 'Update module details'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Modules
      summary: 'Delete/Archive module'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/modules/{moduleId}/status':
    patch:
      tags:
        - Modules
      summary: 'Update module status'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/modules/{moduleId}/order':
    patch:
      tags:
        - Modules
      summary: 'Change module display order'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - display_order
              properties:
                display_order:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/modules/{moduleId}/lectures':
    post:
      tags:
        - Lectures
      summary: 'Create lecture session in module'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: 'Event Loop Deep Dive'
                description:
                  type: string
                  example: 'Microtasks and macrotasks'
                session_type:
                  type: string
                  enum: [LIVE, RECORDED]
                  example: LIVE
                session_url:
                  type: string
                  example: 'https://meet.google.com/xyz'
                duration_minutes:
                  type: integer
                  example: 90
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Lectures
      summary: 'Get lectures in module'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {type: array, items: {$ref: '#/components/schemas/Lecture'}}
  '/api/lectures/{lectureId}':
    get:
      tags:
        - Lectures
      summary: 'Get single lecture by ID'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: lectureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/Lecture'}
    put:
      tags:
        - Lectures
      summary: 'Update lecture details'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: lectureId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                session_url:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Lectures
      summary: 'Delete lecture'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: lectureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/lectures/{lectureId}/status':
    patch:
      tags:
        - Lectures
      summary: 'Update lecture status'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: lectureId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [DRAFT, SCHEDULED, LIVE, COMPLETED, CANCELLED, PUBLISHED]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  '/api/lectures/{lectureId}/order':
    patch:
      tags:
        - Lectures
      summary: 'Update lecture order'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: lectureId
          in: path
